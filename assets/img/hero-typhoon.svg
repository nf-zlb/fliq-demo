<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#3a2a52"/>
      <stop offset="45%" stop-color="#241a3a"/>
      <stop offset="100%" stop-color="#0e0a1a"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#160f28"/>
      <stop offset="100%" stop-color="#0a0714"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a7ff" stop-opacity=".55"/>
      <stop offset="60%" stop-color="#8a4f9e" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#8a4f9e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <rect y="430" width="800" height="170" fill="url(#sea)"/>
  <!-- storm eye glow -->
  <circle cx="560" cy="190" r="230" fill="url(#eye)"/>
  <!-- spiral cloud bands -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="26" stroke-linecap="round">
    <path d="M560 190 m-170,0 a170,170 0 1,1 340,0 a170,170 0 0,1 -80,148"/>
  </g>
  <g fill="none" stroke="#c9a7ff" stroke-opacity=".16" stroke-width="18" stroke-linecap="round">
    <path d="M560 190 m-110,0 a110,110 0 1,0 220,0"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="34" stroke-linecap="round">
    <path d="M560 190 m-260,40 a280,280 0 0,1 470,-90"/>
  </g>
  <!-- distant skyline silhouette -->
  <g fill="#0a0714">
    <rect x="40" y="360" width="26" height="90"/>
    <rect x="76" y="330" width="20" height="120"/>
    <rect x="106" y="380" width="30" height="70"/>
    <rect x="146" y="300" width="22" height="150"/>
    <rect x="178" y="350" width="26" height="100"/>
    <rect x="214" y="320" width="18" height="130"/>
    <rect x="242" y="370" width="24" height="80"/>
    <rect x="276" y="290" width="20" height="160"/>
    <rect x="306" y="340" width="28" height="110"/>
  </g>
  <!-- rain streaks -->
  <g stroke="#c9d3ff" stroke-opacity=".22" stroke-width="2" stroke-linecap="round">
    <line x1="100" y1="120" x2="70" y2="220"/>
    <line x1="180" y1="80" x2="150" y2="190"/>
    <line x1="260" y1="150" x2="230" y2="250"/>
    <line x1="340" y1="60" x2="310" y2="170"/>
    <line x1="420" y1="130" x2="390" y2="240"/>
    <line x1="500" y1="70" x2="470" y2="180"/>
    <line x1="620" y1="100" x2="590" y2="210"/>
    <line x1="700" y1="60" x2="670" y2="170"/>
    <line x1="740" y1="160" x2="710" y2="270"/>
    <line x1="40" y1="250" x2="10" y2="350"/>
  </g>
  <!-- harbour water glints -->
  <g stroke="#8a4f9e" stroke-opacity=".28" stroke-width="2">
    <line x1="0" y1="470" x2="800" y2="470"/>
    <line x1="0" y1="510" x2="800" y2="510"/>
    <line x1="0" y1="550" x2="800" y2="550"/>
  </g>
</svg>
